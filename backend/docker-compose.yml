# NRI Friends API + Postgres (both run on the same EC2 host)
#
#   cp .env.production.example .env   # fill in DB_PASSWORD, JWT, Firebase, AWS, etc.
#   docker compose up -d --build
#
# Postgres data lives in the `pgdata` volume and survives container rebuilds.
# Port 5432 is bound to 127.0.0.1 only — reach it via SSH tunnel, never open it in the security group.

name: nri-friends-backend

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nri-friends-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nri-friends-net

  postgres:
    image: postgres:16-alpine
    container_name: nri-friends-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-nri_friends}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nri-friends-net

networks:
  nri-friends-net:
    driver: bridge

volumes:
  pgdata:
